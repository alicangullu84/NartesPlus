name: GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/nartes-lgs-v1-ui-aeb9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="${{ github.repository }}"
          if ! gh api --method PUT "repos/${repo}/pages" -f cname='nartest.problemcoz.com' -f build_type='workflow'; then
            gh api --method PUT "repos/${repo}/pages" -f cname='nartest.problemcoz.com' -f build_type='workflow' -F https_enforced=false
          fi
          gh api "repos/${repo}/pages" --jq '{cname,build_type,https_enforced,html_url}'
